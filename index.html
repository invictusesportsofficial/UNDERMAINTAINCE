<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maintenance Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">INVICTUS<span>ESPORTS</span></div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Tournaments</a>
    <a href="#">Gallery</a>
    <a href="#">Contact</a>
    <button>Join Now</button>
  </nav>
</header>

<section class="hero">
  <div class="illustration">
    <div class="server">
      <span></span><span></span><span></span>
    </div>
    <div class="arms left"></div>
    <div class="arms right"></div>
  </div>

  <div class="text">
    <h1>SYSTEMS<br><strong>UNDER MAINTENANCE</strong></h1>
    <p>
      We’re upgrading our systems.<br>
      Be back soon — stronger than ever.
    </p>

    <div class="progress">
      <div class="fill"></div>
    </div>

    <div class="time">
      Estimated return in <span id="countdown">02:00:00</span>
    </div>

    <button class="notify">Notify Me When Live</button>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
